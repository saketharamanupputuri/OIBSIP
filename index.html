<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List | OIBSIP</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header><p class="eyebrow">MAKE TODAY COUNT</p><h1>My To-Do List</h1><p>Small steps make big progress.</p></header>
    <form id="task-form">
      <label class="sr-only" for="task-input">New task</label>
      <input id="task-input" maxlength="120" placeholder="What do you need to do?" required>
      <button type="submit">Add task</button>
    </form>
    <div class="toolbar"><span id="task-count">0 tasks left</span><button id="clear-completed" class="text-button" type="button">Clear completed</button></div>
    <ul id="task-list" aria-live="polite"></ul>
    <p id="empty-state">No tasks yet. Add your first task above!</p>
    <p class="note">Tasks are saved in this browser on this device.</p>
  </main>
</body>
</html>
